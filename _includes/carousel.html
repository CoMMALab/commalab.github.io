{% assign number = include.number | minus: 1 %}
<div id="carousel{{ number }}" class="carousel">
  <div class="carousel__viewport" style="padding-bottom: {{ include.height }}{{ include.unit }};">
    <ul class="carousel__track">
      {% for item in page.carousels[number].images %}
        <li class="carousel__slide" data-bg="{{ item.image }}"{% if forloop.first %} style="background-image: url('{{ item.image }}');"{% endif %}>
          {% if item.label %}<div class="carousel__label">{{ item.label }}</div>{% endif %}
        </li>
      {% endfor %}
    </ul>
  </div>
  <nav class="carousel__nav" aria-label="Photo navigation">
    <button type="button" class="carousel__control" data-step="-1" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="carousel__pages"></div>
    <button type="button" class="carousel__control" data-step="1" aria-label="Next photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </nav>
</div>

<style>
.carousel {
  margin: 1rem 0;
}
.carousel__viewport {
  position: relative;
  width: 100%;
  overflow: hidden;
}
.carousel__track {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: flex;
  margin: 0;
  padding: 0;
  list-style: none;
  transition: transform 0.5s ease;
}
.carousel__slide {
  position: relative;
  flex: 0 0 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
}
.carousel__label {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background-color: rgba(0, 0, 0, 0.7);
  color: #fff;
  padding: 5px 10px;
  border-radius: 3px;
  font-size: 0.75rem;
  white-space: nowrap;
  max-width: calc(100% - 20px);
  overflow: hidden;
  text-overflow: ellipsis;
}
.carousel__nav,
.carousel__pages {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
}
.carousel__nav {
  margin-top: 0.5rem;
}
.carousel__pages {
  justify-content: space-between;
}
.carousel__control,
.carousel__page,
.carousel__ellipsis {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2rem;
  height: 2rem;
  padding: 0 0.4rem;
  font-size: 0.9rem;
  line-height: 1;
}
.carousel__control,
.carousel__page {
  border: 1px solid transparent;
  border-radius: 0.25rem;
  background: none;
  color: var(--global-text-color);
  cursor: pointer;
}
.carousel__control:hover,
.carousel__page:hover {
  border-color: var(--global-divider-color);
  color: var(--global-theme-color);
}
.carousel__page[aria-current="true"] {
  background-color: var(--global-theme-color);
  color: var(--global-bg-color);
}
.carousel__ellipsis {
  color: var(--global-text-color-light);
}
.carousel__control svg {
  width: 1.1rem;
  height: 1.1rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
@media (prefers-reduced-motion: reduce) {
  .carousel__track {
    transition: none;
  }
}
</style>

<script>
  (function () {
    var root = document.getElementById("carousel{{ number }}");
    if (!root) return;

    var track = root.querySelector(".carousel__track");
    var slides = root.querySelectorAll(".carousel__slide");
    var pages = root.querySelector(".carousel__pages");
    var n = slides.length;
    var duration = {{ include.duration | default: 0 }} * 1000;
    var current = 0;
    var timer = null;

    if (n < 2) {
      root.querySelector(".carousel__nav").hidden = true;
      return;
    }

    // Always 7 entries (or n, if fewer): first, last, and the current slide's
    // neighbors, padded out near either end so each entry keeps its position.
    var slots = Math.min(n, 7);
    pages.style.width = "calc(" + slots + " * 2rem + " + (slots - 1) + " * 0.25rem)";

    function load(i) {
      var slide = slides[(i + n) % n];
      if (!slide.style.backgroundImage) {
        slide.style.backgroundImage = "url('" + slide.dataset.bg + "')";
      }
    }

    function range(a, b) {
      var r = [];
      for (var i = a; i <= b; i++) r.push(i);
      return r;
    }

    function pageList() {
      if (n <= 7) return range(0, n - 1);
      if (current <= 3) return range(0, 4).concat([null, n - 1]);
      if (current >= n - 4) return [0, null].concat(range(n - 5, n - 1));
      return [0, null, current - 1, current, current + 1, null, n - 1];
    }

    function render() {
      var refocus = pages.contains(document.activeElement);
      pages.textContent = "";
      pageList().forEach(function (i) {
        var el;
        if (i === null) {
          el = document.createElement("span");
          el.className = "carousel__ellipsis";
          el.setAttribute("aria-hidden", "true");
          el.textContent = "…";
        } else {
          el = document.createElement("button");
          el.type = "button";
          el.className = "carousel__page";
          el.textContent = i + 1;
          el.setAttribute("aria-label", "Photo " + (i + 1) + " of " + n);
          if (i === current) el.setAttribute("aria-current", "true");
          el.addEventListener("click", function () {
            go(i);
          });
        }
        pages.appendChild(el);
      });
      if (refocus) pages.querySelector("[aria-current]").focus();
    }

    function schedule() {
      clearTimeout(timer);
      if (duration) {
        timer = setTimeout(function () {
          go(current + 1);
        }, duration);
      }
    }

    function go(i) {
      current = (i + n) % n;
      track.style.transform = "translateX(" + -100 * current + "%)";
      load(current);
      load(current + 1);
      load(current - 1);
      render();
      schedule();
    }

    root.querySelectorAll(".carousel__control").forEach(function (button) {
      button.addEventListener("click", function () {
        go(current + Number(button.dataset.step));
      });
    });

    load(1);
    render();
    schedule();
  })();
</script>
